name: build

# Builds Flo for macOS, Windows and Linux on every push / PR and uploads the installers.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # UI end-to-end on both engines the app ships on (mock backend, Vite preview build):
  #   chromium ≈ Windows WebView2 · webkit ≈ macOS WKWebView + Linux WebKitGTK
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Playwright (chromium + webkit)
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: msi,nsis
          # 24.04: xcap's PipeWire capture needs libspa >= 1.0 (22.04 ships 0.3.48)
          - os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libasound2-dev libssl-dev libdbus-1-dev libxtst-dev libx11-dev libxi-dev \
            libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libegl1-mesa-dev libxcb1-dev libxrandr-dev \
            cmake clang libclang-dev pkg-config patchelf file

      - name: Install JS deps
        run: npm ci

      - name: UI unit tests
        run: npm test

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --release --lib

      - name: Build installers
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: flo-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: ignore
