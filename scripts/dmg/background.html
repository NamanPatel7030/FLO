<!doctype html><html><head><meta charset="utf-8">
<!-- Flo installer window background, 760x480. Rendered to background.tiff (1x + 2x) by scripts/dmg/render-background.cjs.
     Icon centres must match scripts/dmg/settings.py: Flo (210,240), Applications (550,240); Finder draws each label (in black) on the light .plate under its icon. -->
<style>
@font-face{font-family:Inter;src:url(../../website/app/fonts/Inter-normal.woff2);font-weight:400 700}
@font-face{font-family:Serif;src:url(../../website/app/fonts/InstrumentSerif-italic.woff2);font-style:italic}
*{margin:0;box-sizing:border-box}
body{width:760px;height:480px;overflow:hidden;font-family:Inter;color:#fff;position:relative;
background:radial-gradient(120% 90% at 50% 0%,#18204a 0%,#0a0d1f 55%,#05060f 100%)}
.b{position:absolute;border-radius:50%;filter:blur(70px)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(140,170,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(140,170,255,.07) 1px,transparent 1px);background-size:38px 38px;
-webkit-mask-image:radial-gradient(70% 60% at 50% 55%,#000 30%,transparent 80%)}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:170px;height:26px;background:#000;border-radius:0 0 16px 16px;
box-shadow:0 0 0 1px rgba(255,255,255,.06),0 10px 30px rgba(80,120,255,.35);display:flex;align-items:center;justify-content:center;gap:3px}
.notch i{display:block;width:3px;border-radius:2px;background:linear-gradient(#8fd0ff,#b9a8ff)}
.kicker{position:absolute;top:52px;width:100%;text-align:center;font:600 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.32em;color:rgba(160,190,255,.75)}
h1{position:absolute;top:72px;width:100%;text-align:center;font-weight:600;font-size:34px;letter-spacing:-.035em}
h1 i{font-family:Serif;font-weight:400;font-size:1.2em;letter-spacing:-.01em;background:linear-gradient(100deg,#7cc4ff,#a99bff 50%,#ff9ec4);-webkit-background-clip:text;color:transparent;padding-right:4px}
.pad{position:absolute;width:184px;height:206px;border-radius:44px;
background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
border:1px solid rgba(160,190,255,.22);
box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 0 6px rgba(120,150,255,.04),0 30px 60px -24px rgba(0,0,0,.8),0 0 50px -10px rgba(110,130,255,.35)}
.pad::after{content:"";position:absolute;left:22px;right:22px;bottom:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#8fd0ff,#b9a8ff,#ff9ec4,transparent);box-shadow:0 0 12px #a99bff}
.plate{position:absolute;top:313px;width:130px;height:26px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(225,232,255,.85));box-shadow:0 0 0 1px rgba(255,255,255,.4),0 0 18px rgba(150,170,255,.45)}
.step{position:absolute;top:372px;width:184px;text-align:center;font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.24em;color:rgba(170,190,240,.55)}
svg{position:absolute;left:0;top:0}
.foot{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:center}
.pill{display:flex;gap:9px;align-items:center;font-size:12px;color:rgba(220,228,255,.72);padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(160,190,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.pill b{color:#fff;font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:#5fd3b0;box-shadow:0 0 10px #5fd3b0}
</style></head><body>
<div class="b" style="width:380px;height:300px;left:-120px;top:-110px;background:#2f6cff;opacity:.5"></div>
<div class="b" style="width:360px;height:300px;right:-110px;top:-100px;background:#8b5cff;opacity:.45"></div>
<div class="b" style="width:420px;height:200px;left:170px;bottom:-150px;background:#ff5f9e;opacity:.28"></div>
<div class="grid"></div>
<div class="notch"><i style="height:6px"></i><i style="height:11px"></i><i style="height:15px"></i><i style="height:9px"></i><i style="height:12px"></i><i style="height:6px"></i></div>
<p class="kicker">INSTALL · FLO 0.1</p>
<h1>Drag Flo into <i>Applications</i></h1>
<div class="pad" style="left:118px;top:148px"></div>
<div class="pad" style="left:458px;top:148px"></div>
<div class="plate" style="left:145px"></div>
<div class="plate" style="left:485px"></div>
<p class="step" style="left:118px">01 · FLO</p>
<p class="step" style="left:458px">02 · DROP HERE</p>
<svg width="760" height="480">
  <defs>
    <linearGradient id="beam" x1="320" y1="0" x2="440" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7cc4ff" stop-opacity="0"/><stop offset=".35" stop-color="#7cc4ff"/><stop offset=".7" stop-color="#a99bff"/><stop offset="1" stop-color="#ff9ec4"/></linearGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g filter="url(#glow)">
    <line x1="318" y1="240" x2="436" y2="240" stroke="url(#beam)" stroke-width="3" stroke-linecap="round"/>
    <line x1="340" y1="228" x2="400" y2="228" stroke="url(#beam)" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
    <line x1="352" y1="252" x2="416" y2="252" stroke="url(#beam)" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
    <path d="M428 228 L442 240 L428 252" fill="none" stroke="#ff9ec4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
<div class="foot"><div class="pill"><span class="dot"></span>First launch: <b>System Settings › Privacy &amp; Security › Open Anyway</b></div></div>
</body></html>
