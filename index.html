<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flo</title>
    <!-- theme before first paint (no flash): the notch window is always dark; others follow Settings -->
    <script>
      (function () {
        var d = document.documentElement, t = "dark";
        if (location.hash.indexOf("#/island") !== 0) {
          var m = "light";
          try { m = localStorage.getItem("flo:theme-mode") || "light"; } catch (e) {}
          t = m === "system" ? (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : m === "dark" ? "dark" : "light";
        }
        d.dataset.theme = t;
        d.style.colorScheme = t;
        // before the stylesheet paints: the island window must start see-through (no black
        // first frame), and Windows / Linux get their opaque, lighter styles (see src/lib/os.ts)
        if (location.hash.indexOf("#/island") === 0) d.classList.add("island");
        var ua = navigator.userAgent;
        d.classList.add(/Windows/i.test(ua) ? "platform-windows" : /Linux|X11|CrOS/i.test(ua) && !/Android/i.test(ua) ? "platform-linux" : "platform-macos");
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
