<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Flo's mascot, Notchling (Classic · Lucid): the MacBook notch as a friendly intelligence. -->
  <defs>
    <linearGradient id="p" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="#a9dcff"/><stop offset=".5" stop-color="#c7b6ff"/><stop offset="1" stop-color="#ffc2d6"/></linearGradient>
    <linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="eye" gradientUnits="userSpaceOnUse" x1="0" y1="18" x2="0" y2="34"><stop offset="0" stop-color="#c9fbff"/><stop offset=".5" stop-color="#7fd2ff"/><stop offset="1" stop-color="#b48cff"/></linearGradient>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="56"><stop offset="0" stop-color="#151827"/><stop offset="1" stop-color="#08090f"/></linearGradient>
    <filter id="eg" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="c"><rect width="100" height="100" rx="23"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="100" height="100" fill="url(#p)"/>
    <ellipse cx="50" cy="60" rx="30" ry="6" fill="#4b3a8c" opacity=".18" filter="url(#sh)"/>
    <path d="M18 -1 H82 V31 A25 25 0 0 1 57 56 H43 A25 25 0 0 1 18 31 Z" fill="url(#body)"/>
    <g filter="url(#eg)">
      <rect x="35.5" y="19.8" width="7" height="12.4" rx="3.5" fill="url(#eye)"/>
      <rect x="57.5" y="19.8" width="7" height="12.4" rx="3.5" fill="url(#eye)"/>
    </g>
    <circle cx="30.5" cy="41" r="3.3" fill="#ff8fb8" opacity=".6" filter="url(#bl)"/>
    <circle cx="69.5" cy="41" r="3.3" fill="#ff8fb8" opacity=".6" filter="url(#bl)"/>
    <path d="M43.5 42 C46 45 48.4 45 50 42 S54 39 56.5 42" fill="none" stroke="#5fb8ff" stroke-width="2.6" stroke-linecap="round"/>
    <rect width="100" height="100" fill="url(#gl)" opacity=".45"/>
  </g>
  <rect x=".5" y=".5" width="99" height="99" rx="22.5" fill="none" stroke="#ffffff" stroke-opacity=".3"/>
</svg>
