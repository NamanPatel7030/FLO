<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- macOS-style app icon: 824px rounded tile with 100px padding + soft drop shadow -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg" x1="6" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#103250"/>
      <stop offset="0.55" stop-color="#061420"/>
      <stop offset="1" stop-color="#010306"/>
    </linearGradient>
    <radialGradient id="glow" cx="18" cy="12" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#66ceff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#66ceff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="13" y1="20" x2="51" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e3f6ff"/>
      <stop offset="0.5" stop-color="#66ceff"/>
      <stop offset="1" stop-color="#1a9be0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c2ecff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3dbbff" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)">
    <g transform="translate(100 100) scale(12.875)">
      <rect x="0" y="0" width="64" height="64" rx="14.4" fill="url(#bg)"/>
      <rect x="0" y="0" width="64" height="64" rx="14.4" fill="url(#glow)"/>
      <rect x="0.25" y="0.25" width="63.5" height="63.5" rx="14.2" stroke="url(#rim)" stroke-width="0.5"/>
      <path d="M14 39c5-14 12-14 18-7s13 7 18-7" stroke="#66ceff" stroke-opacity="0.28" stroke-width="3.5" stroke-linecap="round" transform="translate(0 6)"/>
      <path d="M14 37c5-14 12-14 18-7s13 7 18-7" stroke="url(#wave)" stroke-width="6.5" stroke-linecap="round"/>
      <circle cx="50" cy="23" r="3.3" fill="#e3f6ff"/>
    </g>
  </g>
</svg>
