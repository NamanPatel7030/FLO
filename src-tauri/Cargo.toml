[package]
name = "flo-flow"
version = "0.1.7"
description = "Flo Flow — local-first voice dictation, assistant, meeting notes and to-dos"
authors = ["Flo Flow"]
edition = "2021"

[lib]
name = "flo_flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["local-stt", "diarize"]
# On-device Whisper (whisper.cpp). Metal on macOS.
local-stt = ["dep:whisper-rs"]
# On-device speaker diarization for meeting call audio (sherpa-onnx: pyannote segmentation +
# 3D-Speaker CAM++ embeddings). Prebuilt static libs are fetched from GitHub at build time.
diarize = ["dep:sherpa-onnx"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
cpal = "0.15"
hound = "3.5"
arboard = "3"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
parking_lot = "0.12"
url = "2"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
sha2 = "0.10"
# AEAD for end-to-end encrypted sync (already in the tree via rustls)
ring = "0.17"
tiny_http = "0.12"
dirs = "5"
whisper-rs = { version = "0.14", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.14", optional = true, features = ["metal"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSGeometry", "NSValue", "NSError"] }
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
foreign-types = "0.5"
sherpa-onnx = { version = "=1.13.8", optional = true, default-features = false, features = ["static"] }

[target.'cfg(target_os = "windows")'.dependencies]
enigo = "0.2"
# Win32 (keyboard hook, windows, registry, UI Automation) + WinRT (OCR, media session); same
# version tauri already pulls in
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Foundation", "Foundation_Collections", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Media_Control", "Data_Xml_Dom", "UI_Notifications", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage"] }

[target.'cfg(target_os = "linux")'.dependencies]
enigo = "0.2"
rdev = "0.5"
active-win-pos-rs = "0.9"
# EWMH active window / activation and idle time (MIT-SCREEN-SAVER); pure Rust, already in the tree
x11rb = { version = "=0.13.2", features = ["screensaver"] }
# MPRIS (now playing / media keys) over the session bus; same version keyring / xcap already use
zbus = "=5.19.0"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# is a compositor running (transparent island or a solid fallback); the same GTK tauri already uses
gtk = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
