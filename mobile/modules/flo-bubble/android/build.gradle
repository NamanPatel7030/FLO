plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.flo.companion'
version = '0.1.0'

android {
  namespace "expo.modules.flobubble"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  // FloCleanupTest: the same cases as the app's jest test (../cleanup-cases.json)
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.json:json:20240303"
}
